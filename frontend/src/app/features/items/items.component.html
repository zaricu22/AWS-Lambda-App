<div class="items-page">
  <header>
    <h1>Items</h1>
    <button type="button" (click)="logout()">Log out</button>
  </header>

  @if (loading()) {
    <p>Loading…</p>
  } @else if (error()) {
    <p class="error">{{ error() }}</p>
  } @else {
    <ul>
      @for (item of items(); track item.id) {
        <li>
          <strong>{{ item.name }}</strong>
          @if (item.description) {
            <span> — {{ item.description }}</span>
          }
        </li>
      }
    </ul>
  }
</div>
